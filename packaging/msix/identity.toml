#
#   Package/Identity/Name                 -> name
#   Package/Identity/Publisher            -> publisher
#   Package/Properties/PublisherDisplayName -> publisher_display_name
#
# A package built from these placeholders installs locally with Developer Mode
# but will be rejected by the Store.
name = "Snakecharmer.Dev"
publisher = "CN=SnakecharmerDev"
publisher_display_name = "Snakecharmer (dev build)"
