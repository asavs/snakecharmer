name: Release

# Pushing a version tag (v0.9.0) builds both exes and attaches them to a
# draft release. Nothing is public until the draft is reviewed and published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s reference -p "test_*.py"
      - run: python reference/keymap_diff.py --self-test
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release
      - name: Verify static CRT linkage
        run: python tools/check-static-crt.py target/release/snakecharmer.exe target/release/charmctl.exe
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Snakecharmer $GITHUB_REF_NAME" \
            --notes "Draft: replace with the release notes before publishing." \
            target/release/snakecharmer.exe target/release/charmctl.exe
