name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        features: ["", "--features pc-vitals"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s reference -p "test_*.py"
      - run: python reference/keymap_diff.py --self-test
      # The full gate for add-device PRs: byte-exact protocol tests plus the
      # SUPPORTED-DEVICES.md drift check.
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace ${{ matrix.features }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo build --release ${{ matrix.features }}
      - name: Verify static CRT linkage
        run: python tools/check-static-crt.py target/release/snakecharmer.exe target/release/charmctl.exe
      - run: python -m unittest discover -s tools -p "test_wishlist*.py"
      # The Pages site is built from the docs; fail here, not after merge.
      - run: python tools/build-site.py _site
