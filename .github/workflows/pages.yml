name: Pages

on:
  push:
    branches: [master]
    paths:
      - site/**
      - tools/build-site.py
      - README.md
      - docs/SUPPORTED-DEVICES.md
      - docs/DEVICE-WISHLIST.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The page fills its mice table, wishlist count and ASCII art from the docs.
      - run: python3 tools/build-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
